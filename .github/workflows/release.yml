name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix for a prerelease) tests, builds and publishes a GitHub release with a
# self-contained Windows x64 exe. Running the workflow by hand is a dry run: the same steps, without the release.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest  # net10.0-windows: DPAPI, and the tests start the Windows exe
    timeout-minutes: 30
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance
      attestations: write  # store it
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT -ne 'push') {
            $version = "0.0.0-dryrun.$env:GITHUB_RUN_NUMBER"
          } elseif ($env:REF_NAME -cmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            $version = $Matches[1]
          } else {
            throw "Tag '$env:REF_NAME' is not vX.Y.Z or vX.Y.Z-suffix."
          }
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "name=discord-mcp-$version-win-x64" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test DiscordMcp.slnx -c Release

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish src/DiscordMcp -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:ContinuousIntegrationBuild=true -p:Version=$env:VERSION
          -o out/exe

      - name: Smoke test the exe (offline)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/scripts/smoke-test.ps1 -Exe out/exe/DiscordMcp.exe -ExpectedVersion $env:VERSION

      - name: Package
        shell: pwsh
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          $stage = New-Item -ItemType Directory -Path "out/$env:NAME"
          Copy-Item out/exe/DiscordMcp.exe, LICENSE, THIRD-PARTY-NOTICES.txt -Destination $stage
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$env:NAME.zip"
          $hash = (Get-FileHash "dist/$env:NAME.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/$env:NAME.zip.sha256", "$hash  $env:NAME.zip`n")
          Get-ChildItem dist, $stage | Format-Table Name, Length

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.version.outputs.name }}.zip
            out/exe/DiscordMcp.exe

      - name: Create the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $notes = (Get-Content .github/release-notes.md -Raw).Replace('{version}', $env:VERSION).Replace('{repo}', $env:GH_REPO)
          $arguments = @($env:TAG) + (Get-ChildItem dist).FullName + @(
            '--verify-tag', '--title', "discord-mcp $env:VERSION", '--notes', $notes, '--generate-notes')
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          gh release create @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
